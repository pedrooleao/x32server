# Monta, testa e publica uma release inteira a partir de uma tag.
#
#   git tag v0.7.0 && git push origin v0.7.0
#
# ou, sem tag, "Run workflow" nesta tela do Actions: a versao vem do
# package.json e a tag e' criada junto com a release.
#
# Antes o .dmg saia de um Mac e o .zip do Windows era baixado do Actions e
# subido a mao. Agora os dois saem daqui, de maquinas de verdade de cada
# sistema, e so viram release se o app empacotado subir e responder como X32 e
# como WING. As notas vem de .github/notas/<tag>.md: a primeira linha, com
# "# ", e' o titulo da release; o resto, o texto.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # O mesmo fluxo de todo push na main: monta o pacote portatil e testa o .exe.
  windows:
    uses: ./.github/workflows/windows.yml

  mac:
    # macos-latest e' Apple Silicon, a mesma arquitetura do .dmg.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Conferir a versao e as notas
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$tag" != "$GITHUB_REF_NAME" ]; then
            echo "A tag e' $GITHUB_REF_NAME, mas o package.json diz $tag"
            exit 1
          fi
          test -f ".github/notas/$tag.md" || { echo "Faltam as notas em .github/notas/$tag.md"; exit 1; }

      - name: Instalar dependencias
        run: npm ci

      - name: Montar o .dmg
        run: ./scripts/montar-app.sh

      # Abre o app de dentro do .dmg, como o usuario abriria, e fala com ele.
      - name: Testar o app empacotado
        run: |
          dmg="$(ls dist/*.dmg)"
          hdiutil attach "$dmg" -nobrowse -mountpoint /Volumes/mesa >/dev/null
          "/Volumes/mesa/Mesa de Playback.app/Contents/MacOS/Mesa de Playback" &
          app=$!
          sleep 15
          ok=0
          node scripts/teste-fumaca.js && node scripts/teste-wing.js && ok=1
          kill $app 2>/dev/null || true
          hdiutil detach /Volumes/mesa >/dev/null || true
          [ $ok = 1 ] || { echo "o app empacotado nao respondeu"; exit 1; }

      - name: Guardar o .dmg
        uses: actions/upload-artifact@v4
        with:
          name: mesa-playback-mac-arm64
          path: dist/*.dmg

  publicar:
    needs: [windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artefatos

      - name: Juntar os arquivos
        run: |
          versao="$(node -p "require('./package.json').version")"
          echo "TAG=v$versao" >> "$GITHUB_ENV"
          mkdir saida
          (cd artefatos/mesa-playback-windows-x64 && zip -qr "../../saida/Mesa-de-Playback-$versao-windows-x64.zip" "Mesa de Playback")
          cp artefatos/mesa-playback-mac-arm64/*.dmg saida/
          ls -la saida

          notas=".github/notas/v$versao.md"
          titulo="$(head -n 1 "$notas" | sed -n 's/^# //p')"
          echo "TITULO=${titulo:-v$versao}" >> "$GITHUB_ENV"
          if [ -n "$titulo" ]; then tail -n +2 "$notas" > corpo.md; else cp "$notas" corpo.md; fi

      - name: Publicar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.TITULO }}
          body_path: corpo.md
          files: saida/*
